# Local development. Postgres is the one already installed on this Mac.
# There is no RDS instance.
#
#   docker compose up --build -d
#
# App: http://localhost:3000

x-app: &app
  image: sacpad:development
  build:
    context: .
    dockerfile: Dockerfile
    target: development
  env_file:
    - .env
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  volumes:
    - .:/rails
    # Homebrew Postgres listens on this socket, not on the Docker host address.
    - /tmp/.s.PGSQL.5432:/tmp/.s.PGSQL.5432
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  networks:
    - app
    - data

services:
  web:
    <<: *app
    command: ["./bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    environment:
      RAILS_ENV: development
      DB_HOST: /tmp
      DB_PORT: "5432"
      DB_SSLMODE: disable
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0}
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  css:
    <<: *app
    command: ["./bin/rails", "tailwindcss:watch"]
    environment:
      RAILS_ENV: development
      DB_HOST: /tmp
      DB_PORT: "5432"
      DB_SSLMODE: disable
    depends_on:
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      RAILS_ENV: development
      DB_HOST: /tmp
      DB_PORT: "5432"
      DB_SSLMODE: disable
      RAILS_MAX_THREADS: ${SIDEKIQ_CONCURRENCY:-5}
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-5}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  redis-init:
    image: redis:7.4-alpine
    user: "0:0"
    network_mode: none
    command: ["chown", "redis:redis", "/data"]
    volumes:
      - redis_data:/data
    restart: "no"

  redis:
    image: redis:7.4-alpine
    user: "redis:redis"
    restart: unless-stopped
    init: true
    depends_on:
      redis-init:
        condition: service_completed_successfully
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "/usr/local/bin/redis-entrypoint.sh"]
    volumes:
      - redis_data:/data
      - ./docker/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - data

networks:
  app:
  data:
    internal: true

volumes:
  redis_data:
